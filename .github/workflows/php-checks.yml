name: PHP checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run skill assessment regression tests
        run: php tests/skill_tests_test.php
      - name: Run application validation tests
        run: php tests/applications_test.php
      - name: Run CSRF protection tests
        run: php tests/csrf_test.php
      - name: Run JSON storage tests
        run: php tests/json_storage_test.php
